<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#183b5a">
<title>VallexPRO — прототип личного кабинета</title>
<style>
:root{--navy:#183b5a;--ink:#202b36;--muted:#74818d;--bg:#f4f6f8;--line:#e3e8ed;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#e9edf1;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:480px;min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 35px #172c4012;display:flex;flex-direction:column}.header{background:var(--navy);color:white;padding:20px 20px 17px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:800;font-size:23px;letter-spacing:1px}.logo span{font-weight:350}.tag{font-size:9px;letter-spacing:1.5px;opacity:.78;margin-top:3px}.avatar{width:40px;height:40px;border-radius:50%;border:1px solid #ffffff70;background:#ffffff20;color:white;font-weight:700}.content{padding:19px 15px 26px;flex:1;min-height:520px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#73818e;font-weight:750}h1{font-size:24px;letter-spacing:-.5px;line-height:1.2;margin:7px 0 5px}h2{font-size:15px;margin:0}.muted{font-size:12px;line-height:1.5;color:var(--muted)}.hero{background:var(--navy);color:white;border-radius:17px;padding:17px;margin-top:16px}.hero .eyebrow,.hero .muted{color:#d3dfe8}.hero h2{font-size:17px;margin:11px 0 7px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.quick{background:white;border:1px solid var(--line);border-radius:14px;padding:13px 12px;text-align:left;min-height:103px;color:#26394a}.quick .ico{display:block;font-size:21px;margin-bottom:12px}.quick b{font-size:12px;display:block}.quick small{font-size:10px;line-height:1.4;color:var(--muted);display:block;margin-top:4px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px;gap:8px}.link{border:0;background:none;color:#315e81;font-size:11px;font-weight:700;padding:5px}.btn{border:0;background:var(--navy);color:white;border-radius:10px;padding:12px 13px;font-size:12px;font-weight:700;width:100%}.btn.secondary{background:#edf2f6;color:var(--navy)}.btn.outline{background:white;color:var(--navy);border:1px solid #d9e1e8}.pill{display:inline-block;border-radius:20px;background:#e5f3e9;color:#267348;padding:5px 8px;font-size:10px;font-weight:750;white-space:nowrap}.pill.gold{background:#f8efdc;color:#89641e}.pill.blue{background:#e8f0f7;color:#315b7e}.row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #edf0f3}.row:last-child{border-bottom:0}.ri{width:42px;height:42px;flex-shrink:0;border-radius:11px;background:#edf2f6;display:grid;place-items:center;font-size:20px}.grow{flex:1;min-width:0}.row b{font-size:12px;display:block}.row small{font-size:10px;color:var(--muted);display:block;margin-top:5px;line-height:1.4}.line{height:1px;background:#edf0f3;margin:13px 0}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.orderhead{display:flex;align-items:center;gap:10px}.orderhead .grow{flex:1}.orderhead b{font-size:12px}.orderhead small{font-size:10px;color:var(--muted);display:block;margin-top:5px}.notice{background:#edf3f8;color:#315575;border-radius:10px;padding:12px;font-size:11px;line-height:1.55;margin-top:12px}.field{display:block;width:100%;border:1px solid #dce3e9;background:#fafbfc;border-radius:9px;padding:11px;margin-top:6px;font-size:12px;color:#26394a}.label{display:block;font-size:11px;color:#687582;margin-top:14px}.product{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f3}.product:last-child{border-bottom:0}.prodimg{width:48px;height:53px;border-radius:10px;background:#f0f3f5;display:grid;place-items:center;font-size:24px;flex-shrink:0}.product b{display:block;font-size:11px;line-height:1.4}.product small{display:block;font-size:10px;color:var(--muted);margin-top:5px}.product .price{font-size:11px;font-weight:750;margin-top:5px}.bottomnav{display:grid;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid var(--line);padding:9px 2px 10px;position:sticky;bottom:0}.navbtn{border:0;background:none;color:#87919b;font-size:9px;display:flex;align-items:center;flex-direction:column;gap:4px;padding:3px 0}.navbtn .ni{font-size:19px}.navbtn.active{color:var(--navy);font-weight:800}.back{border:0;background:none;color:#315d7e;font-size:12px;font-weight:700;padding:0;margin-bottom:16px}.empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:12px;line-height:1.6}.toast{margin-top:12px;padding:11px;border-radius:9px;background:#183b5a;color:white;font-size:11px}.footer-note{text-align:center;color:#7d8994;font-size:10px;padding:0 12px 13px}.hidden{display:none!important}@media(min-width:700px){body{padding:22px 0}.app{border-radius:24px;overflow:hidden;min-height:calc(100vh - 44px);border:1px solid #dce2e8}.bottomnav{position:relative}}
</style></head><body><div class="app"><header class="header"><div><div class="logo">VALLEX<span>PRO</span></div><div class="tag">ПРОФЕССИОНАЛЬНАЯ КОСМЕТОЛОГИЯ</div></div><button class="avatar" data-page="profile" aria-label="Профиль">АК</button></header><main class="content" id="content"></main><nav class="bottomnav"><button class="navbtn active" data-page="home"><span class="ni">⌂</span>Главная</button><button class="navbtn" data-page="catalog"><span class="ni">▦</span>Каталог</button><button class="navbtn" data-page="orders"><span class="ni">▤</span>Заказы</button><button class="navbtn" data-page="docs"><span class="ni">▧</span>Документы</button><button class="navbtn" data-page="profile"><span class="ni">♙</span>Профиль</button></nav><div class="footer-note">Демо-прототип · данные вымышлены · интеграции не подключены</div></div>
<script>
(()=>{const content=document.getElementById('content');let page='home',detail=null,fav=false,toast='';const orders=[{id:'VP-10482',date:'14 октября 2026',status:'В обработке',cls:'gold',sum:'28 450 ₽',items:'3 товара'},{id:'VP-10397',date:'8 октября 2026',status:'Доставлен',cls:'',sum:'16 800 ₽',items:'2 товара'},{id:'VP-10241',date:'22 сентября 2026',status:'Доставлен',cls:'',sum:'34 200 ₽',items:'4 товара'}];const products=[{name:'Cellcosmet — уход для лица',sub:'Профессиональная косметика',price:'Цена после авторизации',icon:'🧴'},{name:'Профессиональная сыворотка',sub:'Уход и восстановление',price:'Цена после авторизации',icon:'🧪'},{name:'Средства для кабинета',sub:'Профессиональный уход',price:'Цена после авторизации',icon:'✨'}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(label,action,cls='')=>`<button class="btn ${cls}" data-action="${esc(action)}">${label}</button>`;const orderCard=o=>`<div class="card"><div class="orderhead"><div class="ri">▤</div><div class="grow"><b>${o.id}</b><small>${o.date} · ${o.items}</small></div><span class="pill ${o.cls}">${o.status}</span></div><div class="line"></div><div class="between"><b style="font-size:13px">${o.sum}</b><button class="link" data-action="order:${o.id}">Подробнее →</button></div></div>`;const productList=()=>`<div class="card">${products.map((p,i)=>`<div class="product"><div class="prodimg">${p.icon}</div><div class="grow"><b>${p.name}</b><small>${p.sub}</small><div class="price">${p.price}</div></div><button class="link" data-action="product:${i}">Открыть</button></div>`).join('')}</div>`;function go(p){page=p;detail=null;toast='';render()}function home(){return `<div class="eyebrow">Личный кабинет</div><h1>Здравствуйте, Анна!</h1><div class="muted">Ваш профессиональный профиль VallexPRO</div><div class="hero"><div class="between"><span class="eyebrow">СТАТУС АККАУНТА</span><span style="font-size:21px">✓</span></div><h2>Профессиональный клиент</h2><div class="muted">Демонстрационный профиль · данные не связаны с сайтом</div><div style="margin-top:15px">${btn('Мой профиль','go:profile','secondary')}</div></div><div class="grid"><button class="quick" data-action="go:orders"><span class="ico">📦</span><b>Мои заказы</b><small>История и статусы</small></button><button class="quick" data-action="go:docs"><span class="ico">📄</span><b>Документы</b><small>Счета и файлы</small></button><button class="quick" data-action="go:favorites"><span class="ico">♡</span><b>Избранное</b><small>Сохранённые товары</small></button><button class="quick" data-action="go:support"><span class="ico">♧</span><b>Поддержка</b><small>Помощь и контакты</small></button></div><div class="sectionhead"><h2>Последний заказ</h2><button class="link" data-action="go:orders">Все заказы →</button></div>${orderCard(orders[0])}<div class="sectionhead"><h2>Обучение и вебинары</h2><button class="link" data-action="go:learning">Подробнее →</button></div><div class="card"><div class="row"><div class="ri">🎓</div><div class="grow"><b>Профессиональное развитие</b><small>Мероприятия и учебные материалы</small></div></div>${btn('Посмотреть раздел','go:learning','outline')}</div>${toast?`<div class="toast">${esc(toast)}</div>`:''}`}
function catalog(){return `<div class="eyebrow">Профессиональный магазин</div><h1>Каталог</h1><div class="muted">Демонстрационные категории и товары</div><div class="card"><input id="search" class="field" style="margin:0" placeholder="⌕ Поиск по названию или бренду"><div class="muted" style="margin-top:8px">Нажмите на товар, чтобы открыть карточку.</div></div><div id="products">${productList()}</div><div class="notice">Цены и наличие не подключены к реальному магазину. В рабочей версии они должны загружаться из 1С-Битрикс или связанной учётной системы.</div>`}
function profile(){return `<div class="eyebrow">Личные данные</div><h1>Мой профиль</h1><div class="card"><div class="orderhead"><div class="avatar" style="background:#e8eef3;color:#183b5a;display:grid;place-items:center">АК</div><div class="grow"><b>Анна Кузнецова</b><small>Специалист · демонстрационный аккаунт</small><span class="pill" style="margin-top:7px">✓ Статус подтверждён (демо)</span></div></div><div class="line"></div><label class="label">Имя и фамилия<input class="field" value="Анна Кузнецова"></label><label class="label">Электронная почта<input class="field" value="anna@example.ru"></label><label class="label">Телефон<input class="field" value="+7 (900) 000-00-00"></label><label class="label">Организация<input class="field" value="Клиника эстетической косметологии"></label><div class="notice">Поля доступны для демонстрации. Изменения пока не сохраняются на сервере.</div><div style="margin-top:12px">${btn('Сохранить изменения','save')}</div></div><div class="card"><h2>Безопасность и верификация</h2><div class="row"><div class="ri">🔒</div><div class="grow"><b>Пароль и доступ</b><small>Управление безопасностью аккаунта</small></div><span>›</span></div><div class="row"><div class="ri">✓</div><div class="grow"><b>Профессиональный статус</b><small>Проверка документов и данных</small></div><span>›</span></div></div>`}
function docs(){return `<div class="eyebrow">Файлы и документы</div><h1>Документы</h1><div class="muted">Центр документов клиента</div><div class="card">${[['📑','Счета и закрывающие документы','Документы по заказам'],['🎓','Сертификаты обучения','Документы о прохождении курсов'],['📋','Документы специалиста','Сведения для профессионального статуса']].map(x=>`<div class="row"><div class="ri">${x[0]}</div><div class="grow"><b>${x[1]}</b><small>${x[2]}</small></div><button class="link" data-action="doc:${x[1]}">Открыть</button></div>`).join('')}</div><div class="notice">Реальные документы должны загружаться из защищённого хранилища с проверкой прав доступа.</div>`}
function ordersPage(){return `<div class="eyebrow">Покупки</div><h1>Мои заказы</h1><div class="muted">Демонстрационная история заказов</div>${orders.map(orderCard).join('')}<div class="notice">Статусы и суммы приведены для демонстрации интерфейса.</div>`}
function support(){return `<div class="eyebrow">Помощь</div><h1>Поддержка</h1><div class="card"><div class="row"><div class="ri">♧</div><div class="grow"><b>Персональный менеджер</b><small>Контакты будут доступны после интеграции</small></div></div><label class="label">Тема обращения<select id="topic" class="field"><option>Вопрос по заказу</option><option>Вопрос по товару</option><option>Документы</option><option>Доступ к аккаунту</option><option>Другое</option></select></label><label class="label">Сообщение<textarea id="message" class="field" rows="4" placeholder="Опишите ваш вопрос..."></textarea></label><div style="margin-top:12px">${btn('Подготовить обращение','support-send')}</div><div class="muted" style="margin-top:8px">В демоверсии сообщение не отправляется.</div></div>`}
function learning(){return `<div class="eyebrow">Профессиональное развитие</div><h1>Обучение</h1><div class="card"><div class="row"><div class="ri">🎓</div><div class="grow"><b>Обучающие мероприятия</b><small>Курсы, вебинары и профессиональные события</small></div></div><p class="muted">В рабочей версии здесь могут быть расписание мероприятий, регистрация и учебные материалы — после согласования источника данных.</p>${btn('Связаться по поводу обучения','go:support','outline')}</div>`}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(detail?.startsWith('order:')){let o=orders.find(x=>x.id===detail.slice(6));content.innerHTML=`<button class="back" data-action="back:orders">← Все заказы</button><div class="eyebrow">Заказ</div><h1>${o.id}</h1><div class="muted">Оформлен ${o.date}</div><div class="card"><div class="between"><h2>Статус</h2><span class="pill ${o.cls}">${o.status}</span></div><div class="line"></div><div class="between"><span class="muted">Сумма заказа</span><b>${o.sum}</b></div><div class="between" style="margin-top:10px"><span class="muted">Состав</span><b>${o.items}</b></div></div><div class="sectionhead"><h2>Состав заказа</h2></div>${productList()}<div style="margin-top:12px">${btn('Повторить заказ','reorder:'+o.id)}</div><div style="margin-top:9px">${btn('Задать вопрос','go:support','outline')}</div>`;return}if(detail?.startsWith('product:')){let p=products[+detail.slice(8)]||products[0];content.innerHTML=`<button class="back" data-action="back:catalog">← Каталог</button><div class="card"><div style="height:120px;border-radius:12px;background:#f0f3f5;display:grid;place-items:center;font-size:54px">${p.icon}</div><div class="eyebrow" style="margin-top:15px">Карточка товара · демо</div><h1 style="font-size:20px">${p.name}</h1><div class="muted">${p.sub}</div><div class="line"></div><div class="between"><span class="muted">Персональная цена</span><b>После авторизации</b></div><div class="notice">Описание, наличие и цены будут загружаться из каталога сайта.</div><div style="margin-top:12px">${btn(fav?'♥ В избранном':'♡ Добавить в избранное','fav')}</div></div>`;return}if(detail?.startsWith('doc:')){content.innerHTML=`<button class="back" data-action="back:docs">← Документы</button><div class="eyebrow">Документы</div><h1>${detail.slice(4)}</h1><div class="card"><div class="empty">📄<br>Демонстрационный раздел.<br>Здесь будут отображаться доступные вам документы.</div></div>`;return}const views={home, catalog, orders:ordersPage,profile,docs,favorites:()=>`<div class="eyebrow">Ваш список</div><h1>Избранное</h1><div class="card">${fav?`<div class="product"><div class="prodimg">🧴</div><div class="grow"><b>${products[0].name}</b><small>${products[0].sub}</small></div><button class="link" data-action="fav">Убрать</button></div>`:`<div class="empty">♡<br>Пока нет сохранённых товаров.<br>Добавьте товары, чтобы быстро находить их позже.</div>${btn('Перейти в каталог','go:catalog')}`}</div>`,support,learning};content.innerHTML=(views[page]||home)();if(page==='catalog'){let input=document.getElementById('search');input.addEventListener('input',()=>{let q=input.value.toLowerCase(),holder=document.getElementById('products'),filtered=products.filter(p=>(p.name+' '+p.sub).toLowerCase().includes(q));holder.innerHTML=filtered.length?`<div class="card">${filtered.map(p=>`<div class="product"><div class="prodimg">${p.icon}</div><div class="grow"><b>${p.name}</b><small>${p.sub}</small><div class="price">${p.price}</div></div><button class="link" data-action="product:${products.indexOf(p)}">Открыть</button></div>`).join('')}</div>`:'<div class="card empty">Ничего не найдено. Попробуйте другой запрос.</div>'})}}
document.querySelector('.bottomnav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});document.querySelector('.avatar').addEventListener('click',()=>go('profile'));document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a.startsWith('go:'))go(a.slice(3));else if(a.startsWith('order:')){detail=a;render()}else if(a.startsWith('product:')){detail=a;render()}else if(a.startsWith('doc:')){detail=a;render()}else if(a.startsWith('back:'))go(a.slice(5));else if(a==='fav'){fav=!fav;render()}else if(a==='save'){alert('Демо: сохранение не подключено. Изменения не отправлены.')}else if(a==='support-send'){alert(document.getElementById('message')?.value.trim()?'Демо: обращение подготовлено, но не отправлено.':'Введите сообщение перед отправкой.')}else if(a.startsWith('reorder:'))alert('Демо: повтор заказа подготовлен. Оформление покупки не выполняется.')});render();})();
</script></body></html>
